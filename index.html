<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spike Bench, A Patch-Clamp Workbench</title>
  <meta name="description" content="Spike Bench runs real Hodgkin-Huxley simulations in the browser. Current clamp steps and ramps, voltage clamp, TTX and TEA channel block, live spike analysis. Built by Aariv Patel.">
  <meta property="og:title" content="Spike Bench, A Patch-Clamp Workbench">
  <meta property="og:description" content="Run Hodgkin-Huxley clamp protocols in the browser, watch the membrane fire, and read spike stats from the same engine the tests run. By Aariv Patel.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0c1024">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c1024'/%3E%3Cpath d='M4 22 L10 22 L13 8 L16 27 L19 22 L28 22' stroke='%23ff9d3d' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="top">
      <h1>Spike Bench</h1>
      <nav class="presets" aria-label="Preset protocols">
        <button class="preset" type="button" data-preset="rest">Resting</button>
        <button class="preset" type="button" data-preset="spike">Single Spike</button>
        <button class="preset" type="button" data-preset="train">Spike Train</button>
        <button class="preset" type="button" data-preset="ttx">TTX Block</button>
        <button class="preset" type="button" data-preset="tea">TEA Block</button>
        <button class="preset" type="button" data-preset="vclamp">Voltage Clamp</button>
      </nav>
    </header>

    <section class="bench" aria-labelledby="run-heading">
      <h2 id="run-heading" class="visually-hidden">Simulation run</h2>

      <div class="controls" aria-label="Protocol controls">
        <label class="field">
          <span>Protocol</span>
          <select id="f-protocol">
            <option value="step" selected>Current clamp, step</option>
            <option value="ramp">Current clamp, ramp</option>
            <option value="vclamp">Voltage clamp</option>
          </select>
        </label>

        <label class="field" data-proto="cc">
          <span>Amplitude, uA/cm&sup2;</span>
          <input id="f-amp" type="number" step="0.5" value="10">
        </label>
        <label class="field" data-proto="vc" hidden>
          <span>Hold, mV</span>
          <input id="f-vhold" type="number" step="1" value="-65">
        </label>
        <label class="field" data-proto="vc" hidden>
          <span>Command, mV</span>
          <input id="f-vcmd" type="number" step="1" value="-20">
        </label>

        <label class="field">
          <span>Start, ms</span>
          <input id="f-start" type="number" step="1" min="0" value="5">
        </label>
        <label class="field">
          <span>Duration, ms</span>
          <input id="f-dur" type="number" step="1" min="0.5" value="20">
        </label>
        <label class="field">
          <span>Post, ms</span>
          <input id="f-post" type="number" step="1" min="0" value="10">
        </label>

        <label class="field">
          <span>TTX block, %</span>
          <input id="f-ttx" type="number" step="5" min="0" max="100" value="0">
        </label>
        <label class="field">
          <span>TEA block, %</span>
          <input id="f-tea" type="number" step="5" min="0" max="100" value="0">
        </label>

        <div class="control-actions">
          <button id="btn-run" class="btn btn-primary" type="button">Run</button>
          <button id="btn-csv" class="btn" type="button" disabled>Export CSV</button>
        </div>
      </div>

      <ul class="stats" aria-label="Run stats">
        <li><span class="stat-label" id="stat-1-label">Spikes</span> <b id="stat-1">0</b></li>
        <li><span class="stat-label" id="stat-2-label">Rate, Hz</span> <b id="stat-2">0</b></li>
        <li><span class="stat-label" id="stat-3-label">Peak, mV</span> <b id="stat-3">-</b></li>
        <li><span class="stat-label" id="stat-4-label">Half width, ms</span> <b id="stat-4">-</b></li>
        <li><span class="stat-label" id="stat-5-label">AHP, mV</span> <b id="stat-5">-</b></li>
      </ul>

      <div class="scope">
        <canvas id="trace" height="300" aria-label="Membrane trace"></canvas>
        <canvas id="stim" height="76" aria-label="Stimulus"></canvas>
        <div id="legend" class="legend" hidden>
          <span><i class="sw sw-ina"></i>iNa</span>
          <span><i class="sw sw-ik"></i>iK</span>
        </div>
      </div>
    </section>
  </main>
  <div id="live" class="visually-hidden" role="status" aria-live="polite"></div>
  <script src="src/neuro.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
